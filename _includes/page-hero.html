{% comment %}
  Shared page hero: banner image with optional title band.
  Params: image (required), alt, title, loading
{% endcomment %}
<div class="page-hero">
  <img src="{{ include.image }}" alt="{{ include.alt }}" {% if include.loading %}loading="{{ include.loading }}"{% endif %}>
  {% if include.title %}
  <div class="page-hero-band">{{ include.title }}</div>
  {% endif %}
</div>
